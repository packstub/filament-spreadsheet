name: Tests

on:
  # Pull requests run once (pull_request); a push runs only on main, after the merge.
  push:
    branches: [main]
  pull_request:

# A newer commit on a pull request replaces the run in progress. A push to main gets a group of its own, so it is never
# cancelled or left waiting: each run compares only its own push, and a docs push right after a code push would
# otherwise cancel the only run that tests the code.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Whether anything but docs, Markdown and the release plumbing changed. When nothing did, the test jobs skip and
  # "Tests passed" still reports (a required check must report, so no paths-ignore on the workflow). Anything not on
  # the list counts as code, so a new kind of file runs the tests.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}

    steps:
      # Two commits are enough: a pull request is checked out as its merge commit, whose first parent is the base.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Compare with the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # The merge commit against main as it is now: exactly what merging would change, wherever the branch started
            # (the event's base.sha can be older than the main the merge commit was made with).
            base=""
            if git rev-parse -q --verify "HEAD^2" >/dev/null; then base="HEAD^1"; fi
          else
            # A push to main: everything since the commit main pointed at before, fetched on its own (no history needed).
            base="$BEFORE"
            if [ -n "$base" ]; then git fetch --quiet --no-tags --depth=1 origin "$base" 2>/dev/null || true; fi
          fi
          # No base to compare with (a new branch, a force push that dropped it): run everything.
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No base to compare with: the tests run."
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # --no-renames: a file moved onto the list (src/Foo.php to docs/foo.md) still shows its old path.
          git diff --name-only --no-renames "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          echo "Changed since $(git rev-parse --short "$base"):"; cat "$RUNNER_TEMP/changed.txt"
          skip='^(docs/|art/|.*\.md$|\.github/((release|dependabot|FUNDING)\.yml$|ISSUE_TEMPLATE/|workflows/(release|github-release|docs-sync|add-to-project|dependabot-auto-merge|fix-php-code-style-issues|package-health)\.yml$))'
          # tests/Feature/InstallTest.php reads README.md, docs/*.md (the publish tags they name) and NOTICE.md: those
          # run the tests.
          keep='^(README\.md|NOTICE\.md|docs/[^/]*\.md)$'
          if grep -qvE "$skip" "$RUNNER_TEMP/changed.txt" || grep -qE "$keep" "$RUNNER_TEMP/changed.txt"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs, Markdown or release plumbing changed: the tests skip."
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  tests:
    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, Filament ${{ matrix.filament }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        laravel: ["12.*", "13.*"]
        # The oldest 4.13 Composer installs: 4.13.0 to 4.13.2 are blocked by security advisories (GHSA-7m6h-rg42-m449, PKSA-cnr1-6g7k-bp3d).
        filament: ["4.13.3", "4.*", "5.*"]
        include:
          - laravel: "12.*"
            testbench: "10.*"
          - laravel: "13.*"
            testbench: "11.*"
        exclude:
          - php: "8.3"
            laravel: "13.*"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-filament${{ matrix.filament }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: vendor/bin/pest

      # The browser side's pure parts (TSV parsing, coercion, the dirty buffer, undo,
      # result application) run on plain Node, no packages: a pinned LTS, so a change
      # of the runner image cannot break the matrix.
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Run browser-side tests
        run: composer test:js

      # The committed bundle (Tabulator + the adapter + the Alpine component) must be
      # the one the sources build: consumers run nothing but filament:assets.
      - name: Check the built bundle is committed
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git diff --exit-code -- resources/dist || (echo "::error::resources/dist is stale: run npm run build and commit it" && exit 1)

  databases:
    # SQLite accepts SQL that MySQL's strict mode and PostgreSQL refuse, has no row locks
    # (`lockForUpdate`), and lets a transaction go on after a refused statement, which
    # Postgres does not (the savepoint per row is for that): the suite runs on both servers as well.
    name: Tests on ${{ matrix.database }} (PHP 8.4, Laravel 13, Filament 5)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            port: 3306
            username: root
            password: ""
          - database: pgsql
            port: 5432
            username: postgres
            password: postgres

    # Each leg starts only its own server: a service whose image is an empty string is not started.
    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: filament_spreadsheet
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filament_spreadsheet
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: filament_spreadsheet
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: ${{ matrix.password }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:13.*" "orchestra/testbench:11.*" "filament/filament:5.*" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest

  # The browser harness (tests/browser/run.mjs): the real view rendered through the test app, driven in headless
  # Chromium through Playwright. One PHP / Laravel / Filament combination: it tests the browser side, the matrix
  # above tests the server side.
  browser:
    name: Browser harness
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright's Chromium
        run: |
          npm ci --no-audit --no-fund
          npx --yes playwright@$(node -p "require('./node_modules/playwright-core/package.json').version") install --with-deps chromium

      - name: Run the browser harness
        env:
          PLAYWRIGHT_CORE: ${{ github.workspace }}/node_modules/playwright-core
        run: npm run test:browser

  # The one check the main branch requires (Settings → Rules): green only when every job above is.
  # A new job goes in `needs`, so the required name stays the same when the matrix changes.
  tests-passed:
    name: Tests passed
    if: always()
    needs: [changes, tests, databases, browser]
    runs-on: ubuntu-latest

    steps:
      # Every job succeeded, or the test jobs skipped because only docs changed (never skipped for another reason).
      - name: Fail unless every job succeeded or skipped for docs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          echo "Job results: $RESULTS (code changed: $CODE)"
          [ "$CHANGES" = "success" ] || exit 1
          for result in $RESULTS; do
            if [ "$result" = "success" ]; then continue; fi
            if [ "$result" = "skipped" ] && [ "$CODE" = "false" ]; then continue; fi
            exit 1
          done
