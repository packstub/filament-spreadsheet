name: Tests

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}, Filament ${{ matrix.filament }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        laravel: ["12.*", "13.*"]
        # The oldest 4.13 Composer installs: 4.13.0 and 4.13.1 are blocked by a security advisory (GHSA-7m6h-rg42-m449).
        filament: ["4.13.2", "4.*", "5.*"]
        include:
          - laravel: "12.*"
            testbench: "10.*"
          - laravel: "13.*"
            testbench: "11.*"
        exclude:
          - php: "8.3"
            laravel: "13.*"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-filament${{ matrix.filament }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run tests
        run: vendor/bin/pest

      # The browser side's pure parts (TSV parsing, coercion, the dirty buffer, undo,
      # result application) run on plain Node, no packages: a pinned LTS, so a change
      # of the runner image cannot break the matrix.
      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Run browser-side tests
        run: composer test:js

      # The committed bundle (Tabulator + the adapter + the Alpine component) must be
      # the one the sources build: consumers run nothing but filament:assets.
      - name: Check the built bundle is committed
        run: |
          npm ci --no-audit --no-fund
          npm run build
          git diff --exit-code -- resources/dist || (echo "::error::resources/dist is stale: run npm run build and commit it" && exit 1)

  databases:
    # SQLite accepts SQL that MySQL's strict mode and PostgreSQL refuse, has no row locks
    # (`lockForUpdate`), and lets a transaction go on after a refused statement, which
    # Postgres does not (the savepoint per row is for that): the suite runs on both servers as well.
    name: Tests on ${{ matrix.database }} (PHP 8.4, Laravel 13, Filament 5)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            port: 3306
            username: root
            password: ""
          - database: pgsql
            port: 5432
            username: postgres
            password: postgres

    # Each leg starts only its own server: a service whose image is an empty string is not started.
    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: filament_spreadsheet
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: filament_spreadsheet
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: filament_spreadsheet
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: ${{ matrix.password }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_mysql, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: |
          composer require "illuminate/contracts:13.*" "orchestra/testbench:11.*" "filament/filament:5.*" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest

  # The browser harness (tests/browser/run.mjs): the real view rendered through the test app, driven in headless
  # Chromium through Playwright. One PHP / Laravel / Filament combination: it tests the browser side, the matrix
  # above tests the server side.
  browser:
    name: Browser harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: pdo_sqlite
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Setup Node 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Playwright's Chromium
        run: |
          npm ci --no-audit --no-fund
          npx --yes playwright@$(node -p "require('./node_modules/playwright-core/package.json').version") install --with-deps chromium

      - name: Run the browser harness
        env:
          PLAYWRIGHT_CORE: ${{ github.workspace }}/node_modules/playwright-core
        run: npm run test:browser
